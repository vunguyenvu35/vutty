name: release
# Builds Vutty for macOS, Windows and Linux and attaches the files to a GitHub Release.
# Start it by merging a change of VERSION into main (the tag is made here), by pushing a tag, or by hand
# (Actions tab -> release -> Run workflow: builds only, publishes nothing).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      publish: ${{ steps.t.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo publish=true >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            TAG="v$(cat VERSION)"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo publish=false >> "$GITHUB_OUTPUT"   # this version is already released
            else
              git tag "$TAG" && git push origin "$TAG"
              echo publish=true >> "$GITHUB_OUTPUT"
            fi
          else
            echo publish=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Linux packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: NSIS (Windows installer)
        if: matrix.name == 'windows'
        run: choco install nsis -y

      - name: Build (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          make build
          ./scripts/package-macos.sh
      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          wails build -nsis -ldflags "-X vutty/app.Version=${{ steps.ver.outputs.version }}"
          mkdir dist
          cp build/bin/vutty.exe "dist/vutty-${{ steps.ver.outputs.version }}-windows-amd64.exe"
          cp THIRD_PARTY_NOTICES.md dist/
          cp build/bin/*installer.exe dist/ 2>/dev/null || true
      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          wails build -ldflags "-X vutty/app.Version=${{ steps.ver.outputs.version }}"
          mkdir dist
          cp THIRD_PARTY_NOTICES.md LICENSE build/bin/
          tar -C build/bin -czf "dist/vutty-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz" vutty THIRD_PARTY_NOTICES.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: vutty-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A copy of every file without the version in its name (vutty-macos.dmg), so that the links of the README never change:
      # https://github.com/<owner>/vutty/releases/latest/download/vutty-macos.dmg is always the newest release. They are in
      # SHA256SUMS too; the app that updates itself looks its file up by the name with the version, so the extra lines do no harm.
      - name: Names without a version
        run: |
          VERSION="$(cat VERSION)"
          cd dist
          for f in vutty-"$VERSION"-*; do cp "$f" "${f/-$VERSION/}"; done
          ls
      - name: Checksums
        run: cd dist && rm -f *.sha256 && sha256sum * > SHA256SUMS
      # The app updates itself only to a release whose checksum list is signed with the maintainer's key (docs/ReleaseSigning.md).
      # Without the secret the release is still published, just not signed: the app then offers the release page instead.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: this release is not signed, so installed copies cannot update themselves to it"
            exit 0
          fi
          go run ./tools/updatesign sign - dist/SHA256SUMS
          go run ./tools/updatesign verify "$(sed -n 's/.*PublicKeyBase64 = "\(.*\)"/\1/p' internal/updater/pubkey.go)" dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="$(cat VERSION)"
          awk -v h="# Vutty $VERSION" '$0==h{f=1;next} /^# Vutty /{f=0} f' RELEASE_NOTES.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a release made by hand for this tag: add (or replace) the files
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Vutty $VERSION" --notes-file notes.md --prerelease
          fi
