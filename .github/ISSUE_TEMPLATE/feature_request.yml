name: Feature request
description: Suggest something Vutty should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation first, then the feature. Which client do you use today for this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Vutty to do
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows, Linux, All]
