<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Sync flow: fetch, read ciphertext, check for the space key, decrypt and merge per record, seal, commit and push; a space without a key is left as it is."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="440" fill="var(--surface)"/>
      <rect x="6" y="6" width="948" height="128" rx="8" class="z-cipher"/>
      <text x="20" y="24" class="h">Git host · ciphertext only</text>
      <rect x="6" y="146" width="948" height="280" rx="8" class="z-local"/>
      <text x="20" y="164" class="h">Your machine · plaintext only in RAM and the local vault</text>

      <rect x="30" y="62" width="130" height="50" rx="6" class="node"/>
      <text x="44" y="84" class="b">1. git fetch</text><text x="44" y="100" class="mono">origin/main</text>
      <rect x="180" y="62" width="160" height="50" rx="6" class="node"/>
      <text x="194" y="84" class="b">2. Read ciphertext</text><text x="194" y="100" class="mono">team.json, spaces/*</text>
      <rect x="780" y="62" width="150" height="50" rx="6" class="node"/>
      <text x="794" y="84" class="b">7. commit + push</text><text x="794" y="100" class="m">on origin/main</text>

      <polygon points="330,270 410,230 490,270 410,310" class="z-key"/>
      <text x="410" y="266" text-anchor="middle" class="b">3. Have the</text>
      <text x="410" y="282" text-anchor="middle" class="b">space key?</text>

      <rect x="520" y="245" width="120" height="50" rx="6" class="node"/>
      <text x="534" y="267" class="b">4. Decrypt</text><text x="534" y="283" class="m">with the space key</text>
      <rect x="670" y="245" width="120" height="50" rx="6" class="node"/>
      <text x="684" y="267" class="b">5. Merge</text><text x="684" y="283" class="m">Rev, base_rev</text>
      <rect x="820" y="245" width="120" height="50" rx="6" class="node"/>
      <text x="834" y="267" class="b">6. Seal</text><text x="834" y="283" class="m">changed spaces</text>

      <rect x="335" y="345" width="150" height="46" rx="6" class="z-bad"/>
      <text x="347" y="365" class="b">Skip this space</text><text x="347" y="381" class="m">left byte for byte</text>
      <rect x="660" y="335" width="270" height="56" rx="6" class="z-bad"/>
      <text x="674" y="356" class="b">Conflicts list</text><text x="674" y="373" class="m">higher Rev wins; the other is restorable</text>

      <path d="M95 62V42H855V62" class="ar" style="marker-end:none"/>
      <path d="M95 42V58" class="ar"/>
      <text x="475" y="36" text-anchor="middle" class="m halo">push rejected (non-fast-forward): back to step 1, a few tries, then report an error</text>
      <path d="M160 87H180" class="ar"/>
      <path d="M340 87H410V230" class="ar"/>
      <path d="M490 270H520" class="ar"/><text x="505" y="262" text-anchor="middle" class="m">yes</text>
      <path d="M410 310V345" class="ar"/><text x="422" y="330" class="m">no</text>
      <path d="M640 270H670" class="ar"/>
      <path d="M790 270H820" class="ar"/>
      <path d="M880 245V112" class="ar"/>
      <path d="M730 295V335" class="ar"/><text x="742" y="320" class="m">both sides changed</text>
    </svg>
