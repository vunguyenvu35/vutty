<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="Joining: the member creates a key pair and sends the public key; the admin re-encrypts the spaces to it and installs it on the servers; the member fetches, decrypts and connects with their own key."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="510" fill="var(--surface)"/><rect x="50" y="14" width="140" height="40" rx="6" class="z-local"/><text x="120" y="39" text-anchor="middle" class="b">Member</text><path d="M120 54V500" class="life"/><rect x="290" y="14" width="140" height="40" rx="6" class="z-key"/><text x="360" y="39" text-anchor="middle" class="b">Admin</text><path d="M360 54V500" class="life"/><rect x="530" y="14" width="140" height="40" rx="6" class="z-cipher"/><text x="600" y="39" text-anchor="middle" class="b">Git host</text><path d="M600 54V500" class="life"/><rect x="770" y="14" width="140" height="40" rx="6" class="node"/><text x="840" y="39" text-anchor="middle" class="b">Servers</text><path d="M840 54V500" class="life"/><rect x="20" y="72" width="250" height="48" rx="6" class="z-key"/><text x="34" y="93" class="b">1. Create a key pair in Vutty</text><text x="34" y="109" class="m">the private key stays here</text><path d="M120 154H360" class="ar"/><text x="240" y="146" text-anchor="middle" class="halo">2. public key + fingerprint</text><text x="240" y="172" text-anchor="middle" class="m halo">not secret, any channel</text><rect x="250" y="188" width="250" height="48" rx="6" class="z-local"/><text x="264" y="209" class="b">3. Compare the fingerprint</text><text x="264" y="225" class="m">choose the spaces</text><path d="M360 268H600" class="ar"/><text x="480" y="260" text-anchor="middle" class="halo">4. re-encrypt spaces, push</text><path d="M360 312H840" class="ar key"/><text x="600" y="304" text-anchor="middle" class="halo">5. Panel installs the public key on the space's servers</text><path d="M120 360H600" class="ar"/><text x="360" y="352" text-anchor="middle" class="halo">6. fetch (read-only access)</text><path d="M600 384H120" class="ar ret"/><text x="360" y="402" text-anchor="middle" class="m halo">ciphertext</text><rect x="20" y="416" width="250" height="48" rx="6" class="z-local"/><text x="34" y="437" class="b">7. Decrypt with own key</text><text x="34" y="453" class="m">the space&#x27;s hosts appear</text><path d="M120 488H840" class="ar"/><text x="480" y="480" text-anchor="middle" class="halo">8. ssh with own key (no shared password)</text></svg>
