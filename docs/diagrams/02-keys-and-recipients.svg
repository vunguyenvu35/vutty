<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="Each space file is age-encrypted to the SSH public keys of its recipients listed in team.json; each person decrypts it with their own private key."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="408" fill="var(--surface)"/><rect x="10" y="40" width="940" height="60" rx="8" class="z-cipher"/><text x="26" y="64" class="mono b">team.json</text><text x="26" y="84" class="m">admins and members (name + SSH public key), recipients and file hash of each space, version, admin signature. Public information.</text><rect x="10" y="128" width="332" height="250" rx="8" class="z-cipher"/><text x="26" y="148" class="h">In Git · spaces/*.enc</text><rect x="24" y="160" width="304" height="92" rx="6" class="node"/><text x="38" y="203" class="mono">spaces/prod.enc</text><text x="38" y="219" class="m">age-encrypted to: Admin A, Member B</text><rect x="24" y="268" width="304" height="92" rx="6" class="node"/><text x="38" y="311" class="mono">spaces/staging.enc</text><text x="38" y="327" class="m">age-encrypted to: Admin A, Member C</text><path d="M176 100V128" class="ar"/><text x="188" y="119" class="m">age encrypts to the recipients</text><text x="490" y="138" text-anchor="middle" class="m">can decrypt with their own private key</text><rect x="640" y="150" width="300" height="56" rx="6" class="z-key"/><text x="654" y="175" class="b">Member B</text><text x="654" y="191" class="m">ed25519 private key stays on the machine</text><rect x="640" y="232" width="300" height="56" rx="6" class="z-key"/><text x="654" y="257" class="b">Admin A</text><text x="654" y="273" class="m">ed25519 private key stays on the machine</text><rect x="640" y="314" width="300" height="56" rx="6" class="z-key"/><text x="654" y="339" class="b">Member C</text><text x="654" y="355" class="m">ed25519 private key stays on the machine</text><path d="M328 190L640 178" class="ar"/><path d="M328 222L640 252" class="ar"/><path d="M328 300L640 268" class="ar"/><path d="M328 330L640 342" class="ar"/><text x="480" y="396" text-anchor="middle" class="m halo">No password anywhere. A repository reader sees public keys and ciphertext only.</text></svg>
