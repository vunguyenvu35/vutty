<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-label="Before: three people open the space with pw3. After: new key K4 and pw4, only two people can open it, and the person who left keeps an old copy."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="444" fill="var(--surface)"/>
      <rect x="16" y="16" width="432" height="300" rx="10" class="panel"/>
      <text x="32" y="40" class="h">Before · epoch 3</text>
      <rect x="140" y="58" width="220" height="48" rx="6" class="z-cipher"/>
      <text x="250" y="79" text-anchor="middle" class="mono">spaces/prod.enc</text><text x="250" y="96" text-anchor="middle" class="m">sealed with K3</text>
      <rect x="50" y="132" width="170" height="40" rx="6" class="node"/>
      <text x="135" y="149" text-anchor="middle" class="mono">slot password</text><text x="135" y="164" text-anchor="middle" class="m">opens with pw3</text>
      <rect x="260" y="132" width="170" height="40" rx="6" class="node"/>
      <text x="345" y="149" text-anchor="middle" class="mono">slot admin</text><text x="345" y="164" text-anchor="middle" class="m">opens with admin password</text>
      <path d="M135 132L190 106" class="ar"/><path d="M345 132L310 106" class="ar"/>
      <circle cx="90" cy="240" r="24" class="z-local"/><text x="90" y="245" text-anchor="middle" class="b">B</text>
      <circle cx="180" cy="240" r="24" class="z-local"/><text x="180" y="245" text-anchor="middle" class="b">C</text>
      <circle cx="345" cy="240" r="24" class="z-key"/><text x="345" y="245" text-anchor="middle" class="b">A</text>
      <path d="M90 216L100 172" class="ar"/><path d="M180 216L170 172" class="ar"/><path d="M345 216V172" class="ar"/>
      <text x="90" y="282" text-anchor="middle" class="m">Member B</text><text x="90" y="297" text-anchor="middle" class="m">stays</text>
      <text x="180" y="282" text-anchor="middle" class="m">Member C</text><text x="180" y="297" text-anchor="middle" class="m">leaves</text>
      <text x="345" y="282" text-anchor="middle" class="m">Admin A</text>

      <path d="M448 160H512" class="ar"/>

      <rect x="512" y="16" width="432" height="300" rx="10" class="panel"/>
      <text x="528" y="40" class="h">After · epoch 4 (one commit)</text>
      <rect x="636" y="58" width="220" height="48" rx="6" class="z-cipher"/>
      <text x="746" y="79" text-anchor="middle" class="mono">spaces/prod.enc</text><text x="746" y="96" text-anchor="middle" class="m">sealed with K4 (new)</text>
      <rect x="546" y="132" width="170" height="40" rx="6" class="node"/>
      <text x="631" y="149" text-anchor="middle" class="mono">slot password</text><text x="631" y="164" text-anchor="middle" class="m">opens with pw4 (new)</text>
      <rect x="756" y="132" width="170" height="40" rx="6" class="node"/>
      <text x="841" y="149" text-anchor="middle" class="mono">slot admin</text><text x="841" y="164" text-anchor="middle" class="m">re-wrapped for K4</text>
      <path d="M631 132L686 106" class="ar"/><path d="M841 132L806 106" class="ar"/>
      <circle cx="586" cy="240" r="24" class="z-local"/><text x="586" y="245" text-anchor="middle" class="b">B</text>
      <circle cx="676" cy="240" r="24" class="z-local ghost dash"/><text x="676" y="245" text-anchor="middle" class="b ghost">C</text>
      <circle cx="841" cy="240" r="24" class="z-key"/><text x="841" y="245" text-anchor="middle" class="b">A</text>
      <path d="M586 216L596 172" class="ar"/><path d="M841 216V172" class="ar"/>
      <path d="M676 216L666 172" class="ar bad"/>
      <text x="704" y="204" class="m">pw3 no longer opens it</text>
      <text x="586" y="282" text-anchor="middle" class="m">Member B</text><text x="586" y="297" text-anchor="middle" class="m">enters pw4 once</text>
      <text x="676" y="282" text-anchor="middle" class="m ghost">Member C</text><text x="676" y="297" text-anchor="middle" class="m ghost">left</text>
      <text x="841" y="282" text-anchor="middle" class="m">Admin A</text>

      <rect x="16" y="336" width="432" height="92" rx="8" class="z-local"/>
      <text x="32" y="358" class="b">Admin does</text>
      <text x="32" y="378">1. Remove C's Git host access if C leaves for good</text>
      <text x="32" y="396">2. Change space password: K4, pw4, reseal, one commit</text>
      <text x="32" y="414">3. Send pw4 to B; B enters it once, loses no edits</text>
      <rect x="512" y="336" width="432" height="92" rx="8" class="z-bad"/>
      <text x="528" y="358" class="b">Cannot be taken back</text>
      <text x="528" y="378">C read the epoch 3 data and keeps a copy on their machine</text>
      <text x="528" y="396">Old Git history still opens with pw3</text>
      <text x="528" y="414">Change the credentials on servers using the app's checklist</text>
    </svg>
