<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-label="Before: three people decrypt the space and log in. After: the space is re-encrypted without the removed member and their key is removed from the servers; nobody else has to do anything."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="444" fill="var(--surface)"/><rect x="16" y="16" width="432" height="300" rx="10" class="panel"/><text x="32" y="40" class="h">Before</text><rect x="76" y="58" width="312" height="48" rx="6" class="z-cipher"/><text x="90" y="79" class="mono">spaces/prod.enc</text><text x="90" y="95" class="m">encrypted to: Admin A, B, C</text><rect x="76" y="122" width="312" height="48" rx="6" class="z-key"/><text x="90" y="143" class="b">Servers of prod</text><text x="90" y="159" class="m">authorized keys: A, B, C</text><circle cx="106" cy="238" r="24" class="z-local"/><text x="106" y="243" text-anchor="middle" class="b">B</text><text x="106" y="284" text-anchor="middle" class="m">Member B</text><text x="106" y="299" text-anchor="middle" class="m">decrypts, logs in</text><circle cx="232" cy="238" r="24" class="z-local"/><text x="232" y="243" text-anchor="middle" class="b">C</text><text x="232" y="284" text-anchor="middle" class="m">Member C</text><text x="232" y="299" text-anchor="middle" class="m">decrypts, logs in</text><circle cx="358" cy="238" r="24" class="z-key"/><text x="358" y="243" text-anchor="middle" class="b">A</text><text x="358" y="284" text-anchor="middle" class="m">Admin A</text><text x="358" y="299" text-anchor="middle" class="m">decrypts, logs in</text><rect x="512" y="16" width="432" height="300" rx="10" class="panel"/><text x="528" y="40" class="h">After (one commit, one Panel run)</text><rect x="572" y="58" width="312" height="48" rx="6" class="z-cipher"/><text x="586" y="79" class="mono">spaces/prod.enc</text><text x="586" y="95" class="m">re-encrypted to: Admin A, B</text><rect x="572" y="122" width="312" height="48" rx="6" class="z-key"/><text x="586" y="143" class="b">Servers of prod</text><text x="586" y="159" class="m">authorized keys: A, B (C removed)</text><circle cx="602" cy="238" r="24" class="z-local"/><text x="602" y="243" text-anchor="middle" class="b">B</text><text x="602" y="284" text-anchor="middle" class="m">Member B</text><text x="602" y="299" text-anchor="middle" class="m">decrypts, logs in</text><circle cx="728" cy="238" r="24" class="z-local ghost dash"/><text x="728" y="243" text-anchor="middle" class="b ghost">C</text><text x="728" y="284" text-anchor="middle" class="m ghost">Member C</text><text x="728" y="299" text-anchor="middle" class="m ghost">no access to new data</text><circle cx="854" cy="238" r="24" class="z-key"/><text x="854" y="243" text-anchor="middle" class="b">A</text><text x="854" y="284" text-anchor="middle" class="m">Admin A</text><text x="854" y="299" text-anchor="middle" class="m">decrypts, logs in</text><path d="M448 160H512" class="ar"/><rect x="16" y="336" width="432" height="92" rx="8" class="z-local"/><text x="32" y="358" class="b">Admin does</text><text x="32" y="378">1. Remove C from the recipients, re-encrypt the space</text><text x="32" y="396">2. Panel removes C's key from the space's servers</text><text x="32" y="414">3. Revoke C's read access on the Git host</text><rect x="512" y="336" width="432" height="92" rx="8" class="z-bad"/><text x="528" y="358" class="b">Cannot be taken back</text><text x="528" y="378">Old commits still open with C's key: the host list C saw</text><text x="528" y="396">No credential was shared, so nothing else needs changing</text><text x="528" y="414">Nobody else enters or receives anything</text></svg>
