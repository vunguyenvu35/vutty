<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Removing a member in one action: on each server end sessions, remove cron jobs, remove from groups and delete the account; verify; then delete the member file and re-encrypt in Git; revoke read access; report, keeping unreachable servers on a pending list."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="420" fill="var(--surface)"/><rect x="6" y="6" width="948" height="214" rx="8" class="panel"/><text x="20" y="24" class="h">Servers · through Panel</text><rect x="6" y="232" width="948" height="176" rx="8" class="z-cipher"/><text x="20" y="250" class="h">Repository and Git host</text><rect x="24" y="72" width="170" height="60" rx="6" class="z-key"/><text x="38" y="99" class="b">Admin: Remove member</text><text x="38" y="115" class="m">one action in Panel</text><rect x="226" y="56" width="270" height="92" rx="6" class="node"/><text x="240" y="78" class="b">1. On each of their servers</text><text x="240" y="98" class="m">end sessions, remove cron jobs</text><text x="240" y="114" class="m">remove from sudo and groups</text><text x="240" y="130" class="m">delete the account</text><polygon points="528,102 590,60 652,102 590,144" class="z-key"/><text x="590" y="98" class="b" text-anchor="middle">Server</text><text x="590" y="114" class="b" text-anchor="middle">reachable?</text><rect x="700" y="74" width="240" height="56" rx="6" class="node"/><text x="714" y="99" class="b">2. Verify</text><text x="714" y="115" class="m">account gone, no session left</text><rect x="520" y="164" width="150" height="44" rx="6" class="z-bad"/><text x="534" y="183" class="b">Pending list</text><text x="534" y="199" class="m">kept and retried</text><path d="M194 102H226" class="ar"/><path d="M496 102H528" class="ar"/><path d="M652 102H700" class="ar"/><text x="676" y="94" class="m" text-anchor="middle">yes</text><path d="M590 144V164" class="ar"/><text x="602" y="158" class="m">no</text><rect x="24" y="262" width="300" height="74" rx="6" class="node"/><text x="38" y="284" class="b">3. Git: member file and recipients</text><text x="38" y="304" class="m">delete the member file, drop the person</text><text x="38" y="320" class="m">from the recipients, re-encrypt, sign, push</text><rect x="360" y="262" width="250" height="74" rx="6" class="node"/><text x="374" y="296" class="b">4. Git host</text><text x="374" y="312" class="m">revoke the read access</text><rect x="650" y="262" width="290" height="74" rx="6" class="z-local"/><text x="664" y="284" class="b">5. Report to the admin</text><text x="664" y="304" class="m">cleared: every server reached</text><text x="664" y="320" class="m">pending: servers not reached yet</text><path d="M820 130V226H290V262" class="ar"/><path d="M595 208V244H795V262" class="ar bad"/><path d="M324 299H360" class="ar"/><path d="M610 299H650" class="ar"/><text x="480" y="396" class="m halo" text-anchor="middle">Access is cut on the servers first; Git comes after. A server that cannot be reached stays on the pending list until it is done.</text></svg>
