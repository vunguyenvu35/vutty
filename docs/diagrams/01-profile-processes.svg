<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" role="img" aria-label="Personal and Team profiles as two processes on one machine, each with its own vault, SQLite and folder; only the Team process talks to the team Git repository."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="424" fill="var(--surface)"/>
      <rect x="16" y="16" width="668" height="388" rx="10" class="panel"/>
      <text x="32" y="40" class="h">Member's machine</text>

      <rect x="40" y="56" width="292" height="304" rx="8" class="z-local"/>
      <text x="56" y="80" class="b">Personal process</text>
      <text x="56" y="96" class="m">as today, unchanged</text>
      <rect x="56" y="108" width="260" height="40" rx="6" class="node"/><text x="70" y="132">Window + Wails bindings</text>
      <rect x="56" y="154" width="260" height="40" rx="6" class="node"/><text x="70" y="178">Core + services (one set)</text>
      <rect x="56" y="200" width="260" height="40" rx="6" class="z-key"/><text x="70" y="224">Vault: its own master password</text>
      <rect x="56" y="246" width="260" height="40" rx="6" class="node"/><text x="70" y="270">Its own SQLite</text>
      <rect x="56" y="292" width="260" height="40" rx="6" class="node"/><text x="70" y="316" class="mono">…/vutty/</text><text x="140" y="316" class="m">+ bridge + lock file</text>

      <rect x="368" y="56" width="292" height="304" rx="8" class="z-local"/>
      <text x="384" y="80" class="b">Team process "acme"</text>
      <text x="384" y="96" class="m mono">vutty --profile acme</text>
      <rect x="384" y="108" width="260" height="40" rx="6" class="node"/><text x="398" y="132">Window + Wails bindings</text>
      <rect x="384" y="154" width="260" height="40" rx="6" class="node"/><text x="398" y="178">Core + services (another set)</text>
      <rect x="384" y="200" width="260" height="40" rx="6" class="z-key"/><text x="398" y="224">Vault: keys of opened spaces</text>
      <rect x="384" y="246" width="260" height="40" rx="6" class="node"/><text x="398" y="270">Its own SQLite</text>
      <rect x="384" y="292" width="260" height="40" rx="6" class="node"/><text x="398" y="316" class="mono">…/profiles/acme/</text><text x="520" y="316" class="m">+ bridge + lock file</text>

      <line x1="350" y1="64" x2="350" y2="356" class="div"/>
      <text x="350" y="384" text-anchor="middle" class="m">no shared memory, no shared vault</text>

      <rect x="730" y="96" width="214" height="116" rx="8" class="z-cipher"/>
      <text x="746" y="120" class="b">Team's private Git repo</text>
      <text x="746" y="144" class="mono">team.json</text>
      <text x="746" y="162" class="mono">spaces/*.enc</text>
      <text x="746" y="190" class="m">ciphertext only</text>
      <path d="M660 154H730" class="ar"/>
      <text x="695" y="144" text-anchor="middle" class="m">fetch / push</text>

      <rect x="730" y="350" width="214" height="56" rx="8" class="node dash"/>
      <text x="746" y="374" class="b">Personal repo (optional)</text>
      <text x="746" y="393" class="mono">bundle.enc</text>
      <path d="M186 360V396H730" class="ar"/>
    </svg>
