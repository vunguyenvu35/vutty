<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Adding an admin: grant write access, add the key, re-encrypt every file, create their account on the servers. Removing an admin: revoke access, drop the key and re-encrypt, delete their accounts, rotate what they could read."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="470" fill="var(--surface)"/><rect x="16" y="16" width="452" height="336" rx="10" class="panel"/><text x="32" y="40" class="h">Add an admin</text><rect x="44" y="54" width="396" height="58" rx="6" class="z-cipher"/><text x="58" y="80" class="b">1. Git host</text><text x="58" y="96" class="m">grant write access (turn on 2FA or SSO)</text><path d="M242 112V124" class="ar"/><rect x="44" y="124" width="396" height="58" rx="6" class="node"/><text x="58" y="150" class="b">2. Vutty: Add admin</text><text x="58" y="166" class="m">compare the fingerprint, add the key to the admins</text><path d="M242 182V194" class="ar"/><rect x="44" y="194" width="396" height="58" rx="6" class="node"/><text x="58" y="220" class="b">3. Re-encrypt every file</text><text x="58" y="236" class="m">new recipient, version up, sign, push</text><path d="M242 252V264" class="ar"/><rect x="44" y="264" width="396" height="58" rx="6" class="z-key"/><text x="58" y="290" class="b">4. Panel: an admin account on the servers</text><text x="58" y="306" class="m">their own account, with admin rights</text><rect x="492" y="16" width="452" height="336" rx="10" class="panel"/><text x="508" y="40" class="h">Remove an admin</text><rect x="520" y="54" width="396" height="58" rx="6" class="z-cipher"/><text x="534" y="80" class="b">1. Git host</text><text x="534" y="96" class="m">revoke write and read access</text><path d="M718 112V124" class="ar"/><rect x="520" y="124" width="396" height="58" rx="6" class="node"/><text x="534" y="150" class="b">2. Vutty: Remove admin</text><text x="534" y="166" class="m">drop from the admins and the recipients, re-encrypt, sign, push</text><path d="M718 182V194" class="ar"/><rect x="520" y="194" width="396" height="58" rx="6" class="node"/><text x="534" y="220" class="b">3. Panel: delete their accounts</text><text x="534" y="236" class="m">on every server, sessions first</text><path d="M718 252V264" class="ar"/><rect x="520" y="264" width="396" height="58" rx="6" class="z-bad"/><text x="534" y="290" class="b">4. Rotate what they could read</text><text x="534" y="306" class="m">passwords and keys the admins issued (not members&#x27; own keys)</text><rect x="16" y="370" width="928" height="84" rx="8" class="z-local"/><text x="32" y="392">At least two admins; the app refuses to remove the last one. Three is comfortable for about 20 developers.</text><text x="32" y="412" class="m">Members do nothing: the new manifest is signed by an admin they already pinned, and a notice shows who was added or removed.</text><text x="32" y="432" class="m">If every admin key is lost, only an offline recovery recipient (open question 3) can still change the team.</text></svg>
