<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Sequence: the admin creates the repo, generates the admin password, creates a space and pushes ciphertext; sends the space password to the member outside Git; the member fetches and enters the password to open the space."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="470" fill="var(--surface)"/>
      <rect x="60" y="14" width="140" height="40" rx="6" class="z-key"/><text x="130" y="39" text-anchor="middle" class="b">Admin</text>
      <rect x="410" y="14" width="140" height="40" rx="6" class="z-cipher"/><text x="480" y="39" text-anchor="middle" class="b">Git host</text>
      <rect x="760" y="14" width="140" height="40" rx="6" class="z-local"/><text x="830" y="39" text-anchor="middle" class="b">Member</text>
      <path d="M130 54V462" class="life"/><path d="M480 54V462" class="life"/><path d="M830 54V462" class="life"/>

      <path d="M130 96H480" class="ar"/>
      <text x="305" y="88" text-anchor="middle" class="halo">1. create a private repo, give members access</text>

      <rect x="30" y="116" width="230" height="50" rx="6" class="z-key"/>
      <text x="44" y="136">2. New team: password generated</text><text x="44" y="154" class="m">shown once, the admin keeps it</text>

      <path d="M130 204H480" class="ar"/>
      <text x="305" y="196" text-anchor="middle" class="halo">3. New space, push team.json + prod.enc (ciphertext)</text>

      <path d="M130 254H830" class="ar key"/>
      <text x="480" y="246" text-anchor="middle" class="halo">4. space password "prod", sent outside Git over a trusted channel</text>

      <path d="M830 302H480" class="ar"/>
      <text x="655" y="294" text-anchor="middle" class="halo">5. clone / fetch (has repo access)</text>
      <path d="M480 328H830" class="ar ret"/>
      <text x="655" y="346" text-anchor="middle" class="m halo">ciphertext: team.json + spaces/*.enc</text>

      <rect x="610" y="362" width="330" height="58" rx="6" class="z-key"/>
      <text x="624" y="382">6. Open a space: enter password, try each slot</text>
      <text x="624" y="398" class="m">on a match the key is kept in the local vault</text>
      <rect x="610" y="430" width="330" height="30" rx="6" class="z-local"/>
      <text x="624" y="450">7. decrypt; hosts show in the sidebar</text>
    </svg>
