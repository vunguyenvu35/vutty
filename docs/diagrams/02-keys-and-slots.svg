<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Space passwords and the admin password open slots in team.json; a slot gives the space key; the space key seals the space file in Git."><style>
:root{--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--surface:#fff;--fg:#1b2330;--muted:#5a6677;--ink-soft:#3d4857;--line:#d9dfe6;--line-strong:#a9b3bf;--local-bg:#e7effb;--local-line:#3a6fcf;--cipher-bg:#e3f3ef;--cipher-line:#1d8573;--key-bg:#fcf0d2;--key-line:#b17414;--bad-bg:#fbe6e3;--bad:#bf3a2b;--accent:#3a6fcf}
@media (prefers-color-scheme:dark){:root{--surface:#161d26;--fg:#e5e9ee;--muted:#9aa5b2;--ink-soft:#b7c0cb;--line:#2b3541;--line-strong:#4b5866;--local-bg:#13233d;--local-line:#6b9bf0;--cipher-bg:#0f2f2a;--cipher-line:#4cc4ae;--key-bg:#382c0e;--key-line:#e2b24f;--bad-bg:#3a1815;--bad:#ff7f6e;--accent:#6b9bf0}}
text{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.m{fill:var(--muted);font-size:11px;font-weight:400}.b{font-weight:600}.mono{font-family:var(--mono);font-size:11.5px}
.h{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}.panel{fill:none;stroke:var(--line);stroke-width:1.2}.panel.pick{stroke:var(--accent);stroke-width:2.2}
.z-local{fill:var(--local-bg);stroke:var(--local-line);stroke-width:1.2}.z-cipher{fill:var(--cipher-bg);stroke:var(--cipher-line);stroke-width:1.2}
.z-key{fill:var(--key-bg);stroke:var(--key-line);stroke-width:1.2}.z-bad{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.2}
.dash{stroke-dasharray:6 4}.ghost{opacity:.55}
.ar{fill:none;stroke:var(--ink-soft);stroke-width:1.6;marker-end:url(#ah)}.ar.key{stroke:var(--key-line);stroke-dasharray:6 4;marker-end:url(#ah-key)}
.ar.bad{stroke:var(--bad);stroke-dasharray:4 3;marker-end:url(#ah-bad)}.ar.ret{stroke-dasharray:5 4}
.life{stroke:var(--line-strong);stroke-dasharray:3 4;fill:none}.div{stroke:var(--line-strong);stroke-dasharray:5 5;fill:none}
.mk{fill:var(--ink-soft)}.mk-key{fill:var(--key-line)}.mk-bad{fill:var(--bad)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-key"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-bad"/></marker></defs><rect width="960" height="420" fill="var(--surface)"/>
      <text x="20" y="22" class="h">Password (held by people)</text>
      <text x="290" y="22" class="h">team.json · slots</text>
      <text x="530" y="22" class="h">Space key</text>
      <text x="770" y="22" class="h">In Git</text>

      <rect x="276" y="32" width="198" height="356" rx="8" class="z-cipher"/>
      <rect x="756" y="32" width="198" height="356" rx="8" class="z-cipher"/>

      <rect x="20" y="48" width="190" height="50" rx="6" class="z-key"/>
      <text x="34" y="70" class="b">Space password "prod"</text><text x="34" y="86" class="m">given to the prod group</text>
      <rect x="20" y="192" width="190" height="56" rx="6" class="z-key"/>
      <text x="34" y="216" class="b">Admin password</text><text x="34" y="233" class="m">admin only, opens every space</text>
      <rect x="20" y="268" width="190" height="50" rx="6" class="z-key"/>
      <text x="34" y="290" class="b">Space password "staging"</text><text x="34" y="306" class="m">given to the staging group</text>

      <rect x="290" y="48" width="170" height="48" rx="6" class="node"/>
      <text x="302" y="69" class="mono">slot password</text><text x="302" y="85" class="m">Argon2id + own salt</text>
      <rect x="290" y="108" width="170" height="48" rx="6" class="node"/>
      <text x="302" y="129" class="mono">slot admin</text><text x="302" y="145" class="m">Argon2id + own salt</text>
      <rect x="290" y="268" width="170" height="48" rx="6" class="node"/>
      <text x="302" y="289" class="mono">slot password</text><text x="302" y="305" class="m">Argon2id + own salt</text>
      <rect x="290" y="328" width="170" height="48" rx="6" class="node"/>
      <text x="302" y="349" class="mono">slot admin</text><text x="302" y="365" class="m">Argon2id + own salt</text>

      <rect x="530" y="82" width="150" height="50" rx="6" class="z-key"/>
      <text x="544" y="104" class="b">Space key prod</text><text x="544" y="120" class="m">AES-256, in RAM only</text>
      <rect x="530" y="302" width="150" height="50" rx="6" class="z-key"/>
      <text x="544" y="324" class="b">Space key staging</text><text x="544" y="340" class="m">AES-256, in RAM only</text>

      <rect x="770" y="82" width="170" height="50" rx="6" class="node"/>
      <text x="782" y="104" class="mono">spaces/prod.enc</text><text x="782" y="120" class="m">name, hosts, secrets…</text>
      <rect x="770" y="302" width="170" height="50" rx="6" class="node"/>
      <text x="782" y="324" class="mono">spaces/staging.enc</text><text x="782" y="340" class="m">name, hosts, secrets…</text>

      <path d="M210 73H290" class="ar"/>
      <path d="M210 213L290 134" class="ar"/>
      <path d="M210 227L290 350" class="ar"/>
      <path d="M210 293H290" class="ar"/>
      <path d="M460 72L530 98" class="ar"/>
      <path d="M460 132L530 116" class="ar"/>
      <path d="M460 292L530 318" class="ar"/>
      <path d="M460 352L530 336" class="ar"/>
      <path d="M680 107H770" class="ar"/>
      <path d="M680 327H770" class="ar"/>
      <text x="725" y="98" text-anchor="middle" class="m">seals</text>
      <text x="725" y="318" text-anchor="middle" class="m">seals</text>
      <text x="495" y="406" text-anchor="middle" class="m halo">Password to slot: Argon2id unlocks the slot. Slot to space key: unwrap.</text>
    </svg>
